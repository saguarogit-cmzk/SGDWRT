# Automatska objava izdanja: push taga vX.Y.Z gradi paket i stvara
# GitHub Release s tar.gz artefaktom koji koriste install.sh i Update modul.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build
        run: |
          cd core
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o ../dist/saguaro-core .
      - name: Package
        run: |
          STAGE=$(mktemp -d)
          cp dist/saguaro-core "$STAGE/"
          mkdir -p "$STAGE/web"
          cp web/* "$STAGE/web/"
          cp image/files/etc/init.d/saguaro-core "$STAGE/init.d-saguaro-core"
          tar -czf "saguaro-${GITHUB_REF_NAME}-linux-amd64.tar.gz" -C "$STAGE" .
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: saguaro-*-linux-amd64.tar.gz
          generate_release_notes: true
