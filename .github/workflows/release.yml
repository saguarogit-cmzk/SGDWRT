# Automatska objava izdanja: push taga vX.Y.Z gradi
#   1. tar.gz paket (koristi ga install.sh i Updates modul)
#   2. gotovu OpenWrt sliku sa svime unutra (za nove uređaje)
name: release
on:
  push:
    tags: ["v*"]
    # probne grane grade sve i ostavljaju artefakte, ali NE stvaraju izdanje —
    # tako se gradnja slike provjerava prije objave verzije
    branches: ["ci/**"]
  # ručno pokretanje: gradi sve i objavi kao artefakt, BEZ stvaranja izdanja —
  # da se gradnja slike može provjeriti prije nego se objavi verzija
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # verzija u kodu mora odgovarati tagu — inače bi izdanje v0.48.0 nosilo
      # binary koji se predstavlja kao v0.47.0
      - name: Provjeri tag ↔ verzija
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          CODE=$(grep -o 'version = "[^"]*"' core/main.go | cut -d'"' -f2)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$CODE" != "$TAG" ]; then
            echo "::error::tag v$TAG ne odgovara core/main.go verziji $CODE"
            exit 1
          fi

      - name: Testovi
        run: |
          cd core && go vet ./... && go test ./...

      - name: Provjera sučelja (webcheck)
        run: node scripts/webcheck.js

      - name: Build
        run: |
          cd core
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o ../dist/saguaro-core .

      - name: Package
        run: |
          # ime refa ide u naziv datoteke, a grana ga ima s kosom crtom
          # (ci/image-test) — bez zamjene tar puca na nepostojećem direktoriju
          NAME="${GITHUB_REF_NAME//\//-}"
          STAGE=$(mktemp -d)
          cp dist/saguaro-core "$STAGE/"
          mkdir -p "$STAGE/web"
          cp web/* "$STAGE/web/"
          cp image/files/etc/init.d/saguaro-core "$STAGE/init.d-saguaro-core"
          cp image/files/etc/init.d/saguaro-datapart "$STAGE/init.d-saguaro-datapart"
          cp image/files/usr/sbin/saguaro-setup "$STAGE/saguaro-setup"
          cp image/files/etc/profile.d/99-saguaro.sh "$STAGE/profile.d-99-saguaro.sh"
          cp scripts/selftest.sh "$STAGE/selftest.sh"
          TARBALL="saguaro-${NAME}-linux-amd64.tar.gz"
          tar -czf "$TARBALL" -C "$STAGE" .
          # otisak paketa — install.sh i Updates modul ga mogu provjeriti
          sha256sum "$TARBALL" | awk '{print $1}' > "$TARBALL.sha256"

      # Gotova slika: OpenWrt + svi paketi + Saguaro + data particija na prvom
      # dizanju. Kod korisnika je onda dovoljno napisati je na USB.
      - name: Alati za ImageBuilder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd build-essential libncurses-dev \
            gawk git gettext libssl-dev xsltproc rsync wget unzip python3

      - name: Slika za nove uređaje
        run: sh image/build.sh

      # slika se ne isporučuje na vjeru — otvara se i gleda što je unutra
      - name: Provjeri sliku
        run: |
          set -o pipefail
          if ! sudo -E sh image/verify.sh $(ls dist/saguaro-*-openwrt-*-x86-64.img.gz) \
               2>&1 | tee /tmp/verify.log; then
            # logovi se ne mogu čitati bez prijave, pa zadnji redci idu u
            # annotation koji je vidljiv i preko javnog API-ja
            tail -25 /tmp/verify.log | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Artefakti (ručno pokretanje)
        uses: actions/upload-artifact@v4
        with:
          name: saguaro-build
          retention-days: 7
          path: |
            saguaro-*-linux-amd64.tar.gz
            saguaro-*-linux-amd64.tar.gz.sha256
            dist/saguaro-*-openwrt-*-x86-64.img.gz
            dist/saguaro-*-openwrt-*-x86-64.img.gz.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            saguaro-*-linux-amd64.tar.gz
            saguaro-*-linux-amd64.tar.gz.sha256
            dist/saguaro-*-openwrt-*-x86-64.img.gz
            dist/saguaro-*-openwrt-*-x86-64.img.gz.sha256
          generate_release_notes: true
